name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meet-recorder .
      # End to end in the image: Chromium + PulseAudio + parec on a fake Meet page.
      - run: docker run --rm --shm-size=512m --entrypoint node meet-recorder --test meet.test.js
