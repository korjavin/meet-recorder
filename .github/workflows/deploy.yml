name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  update-deploy-branch:
    name: Update Deploy Branch & Trigger Portainer
    needs: build-and-push
    runs-on: ubuntu-latest
    # Job-level, not step-level: the `secrets` context is not allowed in a step
    # `if`, and a step's own `env:` is not yet visible to that step's `if`.
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Switch to deploy branch
        run: git checkout -B deploy

      - name: Pin docker-compose.yml to the commit SHA
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i -E "s|image: ghcr.io/[^:]+:.*|image: ghcr.io/${GITHUB_REPO}:${GITHUB_COMMIT_SHA}|g" docker-compose.yml
          grep -q "image: ghcr.io/${GITHUB_REPO}:${GITHUB_COMMIT_SHA}" docker-compose.yml

      - name: Commit and push
        env:
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          git add docker-compose.yml
          git commit -m "Deploy commit ${GITHUB_COMMIT_SHA} [skip ci]" || echo "No changes to commit"
          git push origin deploy --force

      - name: Trigger Portainer redeploy webhook
        if: ${{ env.PORTAINER_WEBHOOK != '' }}
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
